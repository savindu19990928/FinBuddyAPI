steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/finbuddy', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/finbuddy']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: ['run', 'deploy', 'finbuddy', '--image', 'gcr.io/$PROJECT_ID/finbuddy', '--region', 'us-central1', '--platform', 'managed', '--allow-unauthenticated']
